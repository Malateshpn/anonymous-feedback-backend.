spring.application.name=anonymous-feedback-backend

# Server Port (Reads Render's dynamic PORT variable; defaults to 8080 locally)
server.port=${PORT:8080}

# MySQL Database Configuration
# Fallback to local MySQL if SPRING_DATASOURCE_URL is not set locally
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/anonymous_feedback?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:malatesh123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

